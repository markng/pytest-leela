# TEMPORARY DIAGNOSTIC BRANCH ONLY. Not a merge/release/full-CI candidate.
# PR52 remains frozen at3ec; this existing workflow ID runs one bounded probe.
name: T44 bounded native 776 diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    name: t44-776-diagnostic-NOT-a-required-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3ec05c436b3db0d129fc182c6f06fd82a07c8c69
          path: frozen
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: controller
          sparse-checkout: diagnostics
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'
      - uses: actions/download-artifact@v4
        with:
          name: leela-plan-3.14-1
          run-id: 45560790046
          github-token: ${{ github.token }}
          path: origin
      - name: Validate immutable origin and install exact admitted pins
        run: |
          mkdir -p _diag
          python controller/diagnostics/probe.py pins --plan origin/plan.json --output _diag/requirements.txt
          python -m venv "$RUNNER_TEMP/t44-776-venv"
          "$RUNNER_TEMP/t44-776-venv/bin/python" -m pip install -r _diag/requirements.txt
          "$RUNNER_TEMP/t44-776-venv/bin/python" -m pip install --no-deps -e frozen
      - name: Single-host isolated 776 replay and phase observation
        working-directory: frozen
        run: |
          "$RUNNER_TEMP/t44-776-venv/bin/python" ../controller/diagnostics/probe.py run --plan ../origin/plan.json --output ../_diag/replay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t44-native776-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: _diag/
          if-no-files-found: error
          retention-days: 7
