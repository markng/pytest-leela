# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lockfile:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Check uv.lock matches pyproject.toml
      run: |
        python -m pip install --upgrade pip "uv==0.11.19"
        uv lock --check

  pytest-floor:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install the oldest supported pytest
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,django]" "pytest==7.0.0"
    - name: Test with pytest
      run: |
        # pytest 7.0's helpconfig hookwrapper warns when a conftest fails to
        # import, which several tests provoke on purpose.
        pytest -W "ignore::pluggy.PluggyTeardownRaisedWarning"

  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,django]"
    - name: Lint with flake8
      run: |
        pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    - name: Type-check with mypy
      run: |
        mypy
    - name: Test with pytest
      run: |
        pytest
    - name: Mutation testing (self-check)
      run: |
        python -c "
        targets = [f for f in __import__('glob').glob('src/pytest_leela/*.py')
                   if not f.endswith('__init__.py')]
        print(' '.join(f'--target {t}' for t in sorted(targets)))
        " | xargs pytest --leela
