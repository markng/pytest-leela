# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,django]"
    - name: Lint with flake8
      run: |
        pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    - name: Type-check with mypy
      run: |
        mypy
    - name: Test with pytest
      run: |
        pytest
    - name: Mutation testing (self-check)
      run: |
        python -c "
        targets = [f for f in __import__('glob').glob('src/pytest_leela/*.py')
                   if not f.endswith('__init__.py')]
        print(' '.join(f'--target {t}' for t in sorted(targets)))
        " | xargs pytest --leela

  django-stack:
    # The pytest-django DB-block bug only shows on pytest < 9.1 (huub's
    # stack); on 9.1 the end-to-end Django test passes on main as well.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,django]" "pytest==9.0.3"
    - name: End-to-end tests on pytest 9.0.3
      run: |
        pytest tests/leela/describe_end_to_end.py
